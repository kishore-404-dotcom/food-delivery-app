name: Food Delivery Backend CI


on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22


      - name: Install Dependencies
        run: npm install


      - name: Build Docker Image
        run: docker compose build